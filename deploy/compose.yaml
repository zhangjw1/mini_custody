services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mini_custody
      POSTGRES_USER: custody
      POSTGRES_PASSWORD: custody
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custody -d mini_custody"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

